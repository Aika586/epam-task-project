name: Node.js Test Pipeline
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run UI tests
        run: npm run wdio

      - name: Generate Allure report (UI)
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact (UI)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: allure-report

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Generate Allure report (API)
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact (API)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: allure-report